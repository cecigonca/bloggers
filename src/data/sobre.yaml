chamada: Basicamente duas amigas com opinião sobre tudo
texto: |-
  A gente é a Cecília e a Katsuki. Somos amigas há anos e sempre comentamos tudo uma com a outra: restaurante, série, produto, rolê.

  Aqui a gente conta o que achou. Quando a gente concorda, o post tem uma nota só. Quando não, aparecem as duas.
pessoas:
  - nome: Cecília
    frase: a que testa tudo primeiro
  - nome: Katsuki
    frase: a que nunca dá 5 estrelas de primeira
