chamada: Basicamente duas amigas com opinião sobre tudo
texto: A gente é a Cecília e a Katsuki. Aqui a gente conta o que achou de restaurantes, séries, produtos e rolês.
regras:
  - titulo: Sem publi.
    texto: Ninguém paga pra aparecer aqui. Se um dia rolar parceria, o post avisa.
  - titulo: Só avalia o que testou.
    texto: Se tá no blog, a gente foi, comeu, assistiu ou usou de verdade.
  - titulo: Nota sincera.
    texto: Mesmo quando o lugar é lindo e a comida é ruim.
  - titulo: Discordou, aparece.
    texto: Quando cada uma acha uma coisa, o post mostra as duas notas.
pessoas:
  - nome: Cecília
    bio: Troque por duas ou três frases sobre você no admin, em Sobre nós.
  - nome: Katsuki
    bio: Troque por duas ou três frases sobre você no admin, em Sobre nós.
