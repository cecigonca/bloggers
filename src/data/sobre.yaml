chamada: Basicamente duas amigas com opinião sobre tudo
texto: |-
  A gente é a Cecília e a Katsuki. Faz anos que a gente comenta tudo uma com a outra: o restaurante que decepcionou, a série que todo mundo ama e a gente não, o produto que prometeu e não cumpriu.

  Um dia caiu a ficha de que essas opiniões mereciam sair do chat. Então aqui estão, sem publi e sem filtro. Às vezes a gente concorda. Às vezes não, e aí você vai ver as duas notas.
pessoas:
  - nome: Cecília
    frase: a que testa tudo primeiro
    detalhes:
      - rotulo: Especialidade
        valor: comes & bebes
      - rotulo: Julga sem dó
        valor: hype de tiktok
      - rotulo: Não resiste a
        valor: um lugar novo
  - nome: Katsuki
    frase: a que nunca dá 5 estrelas de primeira
    detalhes:
      - rotulo: Especialidade
        valor: filmes & séries
      - rotulo: Julga sem dó
        valor: final mal escrito
      - rotulo: Não resiste a
        valor: uma maratona
