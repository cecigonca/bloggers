chamada: basicamente duas amigas com opinião sobre tudo
texto: |-
  Somos duas amigas que passam o dia mandando no grupo o que presta e o que não presta. Restaurante, série, protetor solar, aquele app que prometia organizar a vida. Nada escapa.

  Um dia a gente percebeu: esse tanto de opinião não podia ficar escondido no WhatsApp. Então aqui está. Do wpp pro blog, sem filtro e sem publi.

  (Texto provisório! Troquem pelo de vocês no admin.)
